<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEV.TOOLS</title>
    <meta name="theme-color" content="#0c0d0b" />
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link href="Dev.Tools.Web.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/boot.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <script>
        // The saved theme, applied before the first paint - the .NET runtime takes seconds to start, and
        // without this a light-theme visitor would stare at the dark page until it does. ThemeMode:
        // 0 system, 1 light, 2 dark (Services/Layout/ThemeMode.cs), stored by PreferencesService.
        (function () {
            var dark = true;
            try {
                var saved = JSON.parse(localStorage.getItem('userPreferences') || '{}');
                var layout = saved.Layout || saved.layout || {};
                var mode = layout.ThemeMode !== undefined ? layout.ThemeMode : layout.themeMode;
                if (mode === 1 || mode === 'Light') {
                    dark = false;
                } else if (mode === 0 || mode === 'System') {
                    dark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
                }
            } catch (e) { /* no storage, or nothing saved yet: keep the design's dark default */ }
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>
</head>

<body>
    <div id="app">
        <!-- Shown while the WebAssembly runtime downloads, then replaced by the app. Plain markup on
             purpose: it has to paint before .NET exists. Driven by js/boot.js, styled by css/boot.css. -->
        <div class="dt-boot" id="dt-boot">
            <div class="dt-boot-mark">
                <svg class="dt-boot-rings" viewBox="0 0 132 132" aria-hidden="true">
                    <circle class="dt-boot-track" cx="66" cy="66" r="60" />
                    <circle class="dt-boot-arc" id="dt-boot-arc" cx="66" cy="66" r="60" />
                </svg>
                <svg class="dt-boot-dashes" viewBox="0 0 132 132" aria-hidden="true">
                    <circle cx="66" cy="66" r="52" />
                </svg>
                <img class="dt-boot-logo" src="logo.svg" width="74" height="74" alt="" />
            </div>

            <div class="dt-boot-brand">
                <div class="dt-boot-wordmark">DEV.TOOLS</div>
                <div class="dt-boot-tagline">the swiss army knife for developers</div>
            </div>

            <div class="dt-boot-progress" role="progressbar" aria-label="Loading Dev Tools">
                <div class="dt-boot-bar">
                    <div class="dt-boot-fill" id="dt-boot-fill"></div>
                    <div class="dt-boot-sheen"></div>
                </div>
                <div class="dt-boot-status">
                    <span class="dt-boot-pct" id="dt-boot-pct">0%</span>
                    <span class="dt-boot-phase" id="dt-boot-phase">starting</span>
                    <span class="dt-boot-size" id="dt-boot-size"></span>
                </div>
            </div>

            <div class="dt-boot-log" id="dt-boot-log"></div>

            <div class="dt-boot-note">
                <span class="dt-boot-dot"></span>first load only · cached afterwards
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        // Restore path encoded by 404.html (GitHub Pages SPA routing).
        (function () {
            var params = new URLSearchParams(window.location.search);
            var path = params.get('path');
            if (path) {
                params.delete('path');
                var qs = params.toString();
                var base = document.querySelector('base').getAttribute('href').replace(/\/$/, '');
                window.history.replaceState(null, '',
                    base + path + (qs ? '?' + qs : '') + window.location.hash);
            }
        })();
    </script>
    <script src="js/boot.js"></script>
    <script>devToolsBoot.start();</script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="js/site.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        // Started by hand so the boot screen can name each resource as it loads. The hook only reports:
        // it returns nothing, and Blazor fetches every resource its own way.
        Blazor.start({ loadBootResource: devToolsBoot.onResource })
            .then(devToolsBoot.done, devToolsBoot.fail);
    </script>
</body>

</html>
